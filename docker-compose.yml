version: '3.8'

services:
  app:
    build: .
    container_name: demon_api_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=demon_super_secret_jwt_key_2026
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: demon_api_redis
    ports:
      - "6379:6379"
    restart: always
